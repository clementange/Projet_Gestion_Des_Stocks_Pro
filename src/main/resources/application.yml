spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gestionstock}
    username: ${DB_USERNAME:postgres}
    # 5b-2i : aucune valeur par defaut pour un secret. Vide = absent -> echec explicite au
    # demarrage (RequiredSecretsValidator), pas une connexion silencieuse avec un mot de passe
    # devinable - voir docs/phase-5b2i-report.md.
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    database: POSTGRESQL
    show-sql: false
    hibernate:
      # Le schema est desormais gere par Flyway (db/migration/Vn__*.sql), plus par Hibernate.
      # "validate" verifie que le mapping des entites correspond au schema reel au demarrage,
      # au lieu de laisser Hibernate le modifier silencieusement (Phase 11).
      ddl-auto: validate
      dialect: org.hibernate.dialect.PostgreSQLDialect
    # Phase 4e : le statement_inspector interceptor.Interceptor (reecriture SQL d'isolation
    # multi-tenant) est SUPPRIME. L'isolation repose desormais entierement sur les verifications
    # d'appartenance explicites des Phases 5b-2a a 5b-2h, prouvees par
    # CrossTenantEndpointMatrixTest. Preuve avant suppression : suite complete verte (271 tests)
    # ET matrice inter-tenant verte avec l'intercepteur desactive - voir docs/phase-4e-report.md.
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Cette base de dev a ete construite par Hibernate ddl-auto=update au fil des Phases 1-10 :
    # on la considere deja a l'etat V1 sans rejouer V1__initial_schema.sql dessus (echouerait,
    # les tables existent deja). Une base neuve (CI, autre poste) executera V1 normalement.
    baseline-on-migrate: true
    baseline-version: 1

server:
  port: ${SERVER_PORT:8081}

jwt:
  # Cle de signature HS256. "secret" (6 caracteres) faisait echouer TOUTE authentification en
  # conditions reelles (io.jsonwebtoken.security.WeakKeyException, jjwt 0.11.5 impose >= 256
  # bits) : jamais detecte par les tests @SpringBootTest, qui n'appellent jamais JwtUtil via une
  # vraie requete HTTP de login. Valeur ci-dessous generee aleatoirement pour cet environnement
  # de dev (384 bits) ; a externaliser via variable d'environnement avant toute mise en prod.
  # 5b-2i : la valeur par defaut precedente etait une veritable cle HS256 en clair dans le
  # depot. Elle doit etre consideree COMPROMISE et rotee (voir docs/phase-5b2i-report.md).
  secret: ${JWT_SECRET:}

cors:
  # Phase 5a : allowedOriginPatterns("*") combine a allowCredentials(true) est la combinaison
  # explicitement interdite par CLAUDE.md (zero-tolerance) - voir SecurityConfiguration.corsFilter
  # et docs/phase-5a-report.md. Valeur par defaut = origine de dev local uniquement ; a
  # externaliser via CORS_ALLOWED_ORIGINS (liste separee par des virgules) avant toute mise en
  # prod, comme JWT_SECRET/MINIO_* ci-dessous.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

minio:
  # Phase 4c : remplace flickr (dont les 4 cles etaient en clair ici, sans ${VAR_ENV:...}, absentes
  # de .env.example - violation zero-tolerance CLAUDE.md trouvee en investiguant, resolue par la
  # suppression complete de l'integration Flickr - voir docs/phase-4c-report.md). Identifiants
  # ci-dessous : ceux par defaut de l'image Docker MinIO officielle, valables uniquement pour un
  # MinIO local de dev ; a changer avant toute mise en prod, comme JWT_SECRET ci-dessus.
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:}
  secret-key: ${MINIO_SECRET_KEY:}
  bucket: ${MINIO_BUCKET:gestiondestock-media}

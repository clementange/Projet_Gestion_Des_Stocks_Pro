# Phase 5b-2i : secrets de test. application.yml n'a plus aucune valeur par defaut sensible, donc
# les tests doivent fournir les leurs. Le datasource et MinIO sont de toute facon ecrases
# dynamiquement par Testcontainers (AbstractIntegrationTest, @DynamicPropertySource) ; ces valeurs
# ne servent qu'a satisfaire RequiredSecretsValidator pour les contextes qui ne passent pas par
# Testcontainers. Aucune n'ouvre quoi que ce soit - voir docs/phase-5b2i-report.md.
jwt.secret=test-only-signing-key-not-used-anywhere-else-0123456789
spring.datasource.password=test-only
minio.access-key=test-only
minio.secret-key=test-only
